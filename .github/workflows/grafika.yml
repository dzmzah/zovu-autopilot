name: ZOVU rolka rysowana

# Проба рисованного ролика: ни одного кадра стока, вся картинка рисуется
# кодом. Отдельным запуском и только руками — это ещё эксперимент, в ленту
# такое попадает только после того, как Захар посмотрит.
on:
  workflow_dispatch:
    inputs:
      scenariusz:
        description: 'Сценарий: czas | odpowiedz | rytm | wszystkie'
        required: false
        default: 'wszystkie'
      bez_glosu:
        description: 'Проба без озвучки (не тратит ElevenLabs)'
        type: boolean
        required: false
        default: false

concurrency:
  group: zovu-grafika
  cancel-in-progress: false

jobs:
  rysuj:
    runs-on: ubuntu-latest
    # Час, а не полчаса. В сцене появились окна с живым видео, и съёмка
    # каждого кадра теперь ждёт перемотку дорожки — на тысяче кадров это
    # заметно дольше. Упереться в таймаут на последней минуте сборки значит
    # потерять и голос, который к тому моменту уже оплачен.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Zależności
        run: |
          npm ci --omit=dev || npm install --omit=dev
          npx playwright install --with-deps chromium

      - name: Narysuj
        env:
          ELEVENLABS_KEY: ${{ secrets.ELEVENLABS_KEY }}
          ELEVENLABS_VOICE: ${{ secrets.ELEVENLABS_VOICE }}
          SCEN: ${{ inputs.scenariusz }}
          BEZ: ${{ inputs.bez_glosu }}
        # Сценарии снимаем ПО ОЧЕРЕДИ в одном прогоне, а не тремя джобами:
        # ffmpeg и Chromium ставятся четыре минуты, и платить это трижды за
        # ролики, которые всё равно уедут одним артефактом, нечем оправдать.
        #
        # Один упавший сценарий не должен уносить остальные: если ролик не
        # собрался, пишем это в лог и идём дальше. Три ролика минус один
        # лучше, чем ноль.
        # Проверки пишем блоками if, а не через `[ ... ] && ...`: шаг идёт под
        # `bash -e`, и такая строка на ложном условии возвращает единицу — то
        # есть роняет прогон ровно в благополучном случае.
        run: |
          BG=""
          if [ "$BEZ" = "true" ]; then BG="--bez-glosu"; fi
          LISTA="$SCEN"
          if [ -z "$LISTA" ] || [ "$LISTA" = "wszystkie" ]; then LISTA="czas odpowiedz rytm"; fi
          padlo=0
          for s in $LISTA; do
            echo "::group::$s"
            if ! node rolka-grafika.mjs --scenariusz="$s" $BG; then
              echo "::warning::scenariusz $s nie zbudował się"
              padlo=$((padlo+1))
            fi
            echo "::endgroup::"
          done
          ls -la out/auto-grafika-*.mp4 || true
          # Ни одного ролика — это провал прогона, а не предупреждение.
          if ! ls out/auto-grafika-*.mp4 >/dev/null 2>&1; then
            echo "::error::żaden scenariusz nie zbudował się"
            exit 1
          fi
          if [ "$padlo" -gt 0 ]; then echo "::warning::gotowe nie wszystkie — padło $padlo"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rolka-rysowana
          path: out/auto-grafika-*.mp4
          retention-days: 7
          if-no-files-found: ignore
