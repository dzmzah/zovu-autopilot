name: ZOVU rolka rysowana

# Проба рисованного ролика: ни одного кадра стока, вся картинка рисуется
# кодом. Отдельным запуском и только руками — это ещё эксперимент, в ленту
# такое попадает только после того, как Захар посмотрит.
on:
  workflow_dispatch:

concurrency:
  group: zovu-grafika
  cancel-in-progress: false

jobs:
  rysuj:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Zależności
        run: |
          npm ci --omit=dev || npm install --omit=dev
          npx playwright install --with-deps chromium

      - name: Narysuj
        env:
          ELEVENLABS_KEY: ${{ secrets.ELEVENLABS_KEY }}
          ELEVENLABS_VOICE: ${{ secrets.ELEVENLABS_VOICE }}
        run: node rolka-grafika.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rolka-rysowana
          path: out/auto-grafika-*.mp4
          retention-days: 7
          if-no-files-found: ignore
