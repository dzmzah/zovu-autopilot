name: ZOVU rolki auto

# Собирает рилс целиком на серверах GitHub и ставит в очередь на выкладку
# ЧЕРЕЗ ДВА ДНЯ. Запас в два дня нужен затем, чтобы сбой сборки не оставил
# ленту пустой: к моменту публикации ролик уже неделю как готов и проверен.
#
# Репозиторий публичный, значит минуты Actions не тратятся вообще.
on:
  workflow_dispatch:
    inputs:
      ile:
        description: 'Сколько рилсов собрать'
        type: string
        default: '1'
      typ:
        description: 'Тип рилса: stok | grafika (пусто = по кругу)'
        type: string
        default: ''
      scenariusz:
        description: 'Номер сценария из банка (пусто = по очереди)'
        type: string
        default: ''
      bez_kolejki:
        description: 'Только собрать и показать, в очередь не ставить'
        type: boolean
        default: false
      za_dni:
        description: 'Через сколько дней публиковать (по умолчанию 2)'
        type: string
        default: '2'
      plyty:
        description: 'Плита хука с нулевого кадра и кадр-сводка перед аутро (проба)'
        type: boolean
        default: false
  schedule:
    # 04:20 UTC = 06:20 по Польше: собираем задолго до слотов публикации,
    # чтобы поломка была видна с утра, а не за минуту до выкладки.
    - cron: '20 4 * * *'

concurrency:
  group: zovu-rolki-auto
  cancel-in-progress: false

jobs:
  zbuduj:
    runs-on: ubuntu-latest
    # 70, а не 45: рисованный ролик снимается браузером покадрово и идёт
    # вдвое дольше стокового. На 45 он упирался в таймаут на последних
    # минутах — то есть голос уже оплачен, а ролика нет.
    timeout-minutes: 70
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Zależności node
        run: |
          npm ci --omit=dev || npm install --omit=dev
          npx playwright install --with-deps chromium

      - name: Głos (Piper)
        run: python -m pip install --quiet piper-tts

      # Модель голоса 63 МБ — держим в кэше, а не в репозитории.
      - name: Model głosu z pamięci podręcznej
        id: glos-cache
        uses: actions/cache@v4
        with:
          path: modele
          key: piper-pl-darkman-medium-v1

      - name: Pobierz model głosu
        if: steps.glos-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p modele
          BASE=https://huggingface.co/rhasspy/piper-voices/resolve/main/pl/pl_PL/darkman/medium
          curl -sL -o modele/pl_PL-darkman-medium.onnx      $BASE/pl_PL-darkman-medium.onnx
          curl -sL -o modele/pl_PL-darkman-medium.onnx.json $BASE/pl_PL-darkman-medium.onnx.json
          ls -la modele

      - name: Zbuduj rolki
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          ELEVENLABS_KEY: ${{ secrets.ELEVENLABS_KEY }}
          ELEVENLABS_VOICE: ${{ secrets.ELEVENLABS_VOICE }}
          PIPER_MODEL: ${{ github.workspace }}/modele/pl_PL-darkman-medium.onnx
          ILE: ${{ inputs.ile || '1' }}
          TYP: ${{ inputs.typ }}
          SCENARIUSZ: ${{ inputs.scenariusz }}
          PLYTY: ${{ inputs.plyty }}
        run: |
          set -e
          # Расписание больше не знает, каким сборщиком собирать. Оно зовёт
          # zbuduj-rolke.mjs, а тот берёт следующий ТИП из реестра
          # typy-rolek.mjs. Пока типов два — сток и рисованный, — и лента
          # идёт через день: один такой, один такой.
          FLAGI=""
          if [ "$PLYTY" = "true" ]; then FLAGI="--plyty"; fi
          if [ -n "$TYP" ]; then FLAGI="$FLAGI --typ=$TYP"; fi
          for i in $(seq 1 "${ILE:-1}"); do
            echo "::group::rolka $i"
            if [ -n "$SCENARIUSZ" ]; then
              node zbuduj-rolke.mjs --scenariusz="$SCENARIUSZ" $FLAGI
            else
              node zbuduj-rolke.mjs $FLAGI
            fi
            echo "::endgroup::"
          done

      # Запас в два дня — норма. Единицу ставим только руками и только чтобы
      # закрыть дыру в ленте: например ту, что осталась от холодного старта,
      # когда первая сборка легла сразу на послезавтра.
      # `--z-grafika` обязателен: без него очередь отбрасывает всё, что
      # называется auto-grafika-*, и рисованный ролик собирался бы вхолостую.
      # Проверку замерами это не ослабляет — она стоит до очереди, внутри
      # каждого сборщика, и рисованный проходит её на общих правах.
      - name: Do kolejki
        if: ${{ !inputs.bez_kolejki }}
        run: node do-kolejki.mjs --za-dni=${{ inputs.za_dni || '2' }} --z-grafika

      # Цифры по уже вышедшим рилсам. Без обратной связи автоматика не
      # улучшается, а дрейфует: те же шаблоны, тот же голос, и через месяц
      # лента однообразна. Считаем досмотр, сохранения и пересылки — лайк
      # не решает ничего, площадка разносит по досмотру.
      #
      # Шаг стоит ДО записи, и это важно. Он был после — то есть цифры
      # снимались уже после коммита, `rolki/wyniki.json` оставался на сервере
      # GitHub и умирал вместе с ним. Каждый день заново «записей: 1, новых: 1»,
      # история не копилась вообще, и вся вторая неделя плана — выбор сценария
      # по результатам — стояла бы на пустом файле.
      - name: Zbierz wyniki
        if: ${{ !inputs.bez_kolejki }}
        continue-on-error: true
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: node wyniki.mjs --raport

      # Страницу пересобираем и здесь, а не только в прогоне постов: иначе
      # свежий ролик появлялся бы на ней с задержкой до утра, то есть уже
      # после того, как его можно было снять с выкладки.
      - name: Odśwież stronę
        if: ${{ !inputs.bez_kolejki }}
        continue-on-error: true
        run: node gotowe.mjs

      - name: Zapisz
        if: ${{ !inputs.bez_kolejki }}
        run: |
          git config user.name  "zovu-autopilot"
          git config user.email "autopilot@zovu.pl"
          git add rolki/ index.html || true
          git diff --cached --quiet && echo "нечего записывать" && exit 0
          git commit -m "rolki: собран автоматический рилс [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::Не записал очередь — рилс собран, но не поставлен на выкладку"
          exit 1

      - name: Zachowaj podgląd
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rolka-podglad
          path: |
            out/*.mp4
            out/*-glos.mp3
          retention-days: 7
          if-no-files-found: ignore
