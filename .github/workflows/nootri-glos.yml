name: ZOVU lektor do rolki Nootri

# Głos do próbnej rolki dla klienta nootripolska (Useme).
#
# Na serwerze, bo klucz ElevenLabs siedzi w sekretach GitHuba. Lokalnie skrypt
# świadomie się wywala zamiast po cichu podstawić Pipera — to już raz kosztowało
# nas godzinę naprawiania nie tej przyczyny.
#
# Wynikiem są DWA pliki: ścieżka w jednym kawałku i rozpiska (granice fraz i słów).
# Po rozpisce tnie się obraz i rysuje napisy, więc dźwięku nie ruszamy.
on:
  workflow_dispatch:
    inputs:
      dostawca:
        description: 'eleven (domyślnie) albo gemini'
        type: string
        required: false
        default: ''
      glos_google:
        description: 'Голос Google, напр. pl-PL-Chirp3-HD-Puck'
        type: string
        required: false
        default: 'pl-PL-Chirp3-HD-Puck'
      glos_gemini:
        description: 'Głos Gemini, np. Charon / Algieba / Fenrir / Puck'
        type: string
        required: false
        default: 'Charon'

jobs:
  lektor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Synteza
        env:
          ELEVENLABS_KEY: ${{ secrets.ELEVENLABS_KEY }}
          ELEVENLABS_VOICE: ${{ secrets.ELEVENLABS_VOICE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_CLIENT_ID: ${{ secrets.GCP_CLIENT_ID }}
          GCP_CLIENT_SECRET: ${{ secrets.GCP_CLIENT_SECRET }}
          GCP_REFRESH_TOKEN: ${{ secrets.GCP_REFRESH_TOKEN }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GOOGLE_VOICE: ${{ inputs.glos_google || vars.GOOGLE_VOICE }}
          GLOS_DOSTAWCA: ${{ inputs.dostawca || 'google' }}
          GEMINI_VOICE: ${{ inputs.glos_gemini }}
        run: node nootri-lektor.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: nootri-glos
          path: |
            out/nootri/nootri-glos.wav
            out/nootri/nootri-glos.json
          if-no-files-found: error
