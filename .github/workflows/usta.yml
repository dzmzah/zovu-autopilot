# Проба пересборки губ на серверах.
#
# Зачем здесь, а не на машине Захара: MuseTalk тянет за собой mmcv/mmdet/mmpose,
# которые на Windows собираются через боль, а на Linux ставятся штатно. Плюс
# автопилот и так живёт здесь — если узел заработает, он встанет в общий
# конвейер и ПК будет не нужен.
#
# Считаем на процессоре: видеокарты у бесплатных серверов нет. Задача прогона —
# узнать, сколько это занимает и годится ли картинка. Если 35 секунд речи
# считаются дольше часа — узел переезжает на ПК, а выкладка остаётся здесь.
name: ZOVU usta

on:
  workflow_dispatch:
    inputs:
      wideo:
        description: 'Клип с лицом (путь в репозитории)'
        type: string
        default: 'proba-ust/kuba.mp4'
      dzwiek:
        description: 'Дорожка голоса'
        type: string
        default: 'proba-ust/glos.wav'

jobs:
  usta:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Забрать MuseTalk
        run: git clone --depth 1 https://github.com/TMElyralab/MuseTalk.git silnik

      # Колёса и веса кэшируем: без этого каждая попытка начинается с нуля,
      # а их будет несколько — узел новый.
      - name: Кэш колёс
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: usta-pip-${{ hashFiles('silnik/requirements.txt') }}

      - name: Кэш весов
        id: wagi
        uses: actions/cache@v4
        with:
          path: silnik/models
          key: usta-modele-v15-d

      - name: Torch без видеокарты
        run: |
          python -m pip install -q -U pip
          # Версия не случайная: под неё есть ГОТОВЫЕ сборки mmcv, и его не
          # надо компилировать. Две попытки собрать из исходников упали на
          # том, что setuptools 81 выбросил pkg_resources.
          pip install -q torch==2.1.0 torchvision==0.16.0 torchaudio==2.1.0             --index-url https://download.pytorch.org/whl/cpu

      - name: Зависимости
        working-directory: silnik
        env:
          PIP_NO_BUILD_ISOLATION: '1'
        run: |
          # Старый setuptools нужен пакетам mmlab: часть из них до сих пор
          # импортирует pkg_resources в setup.py.
          pip install -q "setuptools<80" wheel
          # tensorflow из их списка нужен для обучения, не для счёта, а тянет
          # полтора гигабайта и ссорится с numpy.
          grep -v -E '^(tensorflow|tensorboard)' requirements.txt > req.txt
          pip install -q -r req.txt
          pip install -q mmcv==2.1.0             -f https://download.openmmlab.com/mmcv/dist/cpu/torch2.1.0/index.html
          pip install -q mmdet==3.2.0
          # mmpose тянет chumpy — древний пакет, чей установочный скрипт зовёт
          # внутренности pip и падает на любой современной версии. Нужен он
          # только для моделей ТЕЛА, а нам нужно лицо. Ставим без зависимостей
          # и доставляем то, что действительно используется.
          pip install -q mmpose==1.2.0 --no-deps
          pip install -q json_tricks munkres xtcocotools
          python -c "import mmcv, mmpose, torch; print('mmcv', mmcv.__version__, '| torch', torch.__version__)"

      - name: Веса
        if: steps.wagi.outputs.cache-hit != 'true'
        working-directory: silnik
        run: |
          pip install -q -U "huggingface_hub[cli]" gdown
          bash download_weights.sh
          # Их скрипт молча пропускает часть файлов, а кэш потом сохраняет
          # неполный набор — и следующий прогон падает уже на счёте, далеко
          # от причины. Добираем недостающее явно и проверяем список.
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          import os, shutil
          from huggingface_hub import snapshot_download
          # Целыми папками: у них внутри и веса, и настройки, а без настроек
          # библиотека падает жалобой на отсутствующий config.json.
          for repo, kat in [("stabilityai/sd-vae-ft-mse", "models/sd-vae"),
                            ("openai/whisper-tiny", "models/whisper")]:
              if os.path.exists(os.path.join(kat, "config.json")):
                  print("есть", kat); continue
              snapshot_download(repo_id=repo, local_dir=kat,
                                allow_patterns=["*.json", "*.bin", "*.txt", "*.safetensors"])
              print("добрал", kat)

          nado = [
              ("TMElyralab/MuseTalk", "musetalkV15/unet.pth", "models/musetalkV15"),
              ("TMElyralab/MuseTalk", "musetalkV15/musetalk.json", "models/musetalkV15"),
              ("yzd-v/DWPose", "dw-ll_ucoco_384.pth", "models/dwpose"),
              ("ManyOtherFunctions/face-parse-bisent", "79999_iter.pth", "models/face-parse-bisent"),
              ("ManyOtherFunctions/face-parse-bisent", "resnet18-5c106cde.pth", "models/face-parse-bisent"),
          ]
          for repo, plik, kat in nado:
              cel = os.path.join(kat, os.path.basename(plik))
              if os.path.exists(cel):
                  print("есть", cel); continue
              os.makedirs(kat, exist_ok=True)
              p = hf_hub_download(repo_id=repo, filename=plik)
              shutil.copy(p, cel)
              print("добрал", cel)
          PY
          echo "--- что лежит в models:"
          find models -name '*.pth' -o -name '*.bin' -o -name '*.json' | head -30

      # Скачивалка весов тянет свежий huggingface_hub, а transformers из
      # списка MuseTalk работает только со старым. Возвращаем на место ПОСЛЕ
      # скачивания — иначе не скачается.
      - name: Вернуть версию библиотеки
        run: pip install -q "huggingface_hub==0.25.2"

      - name: Наш материал
        run: |
          mkdir -p silnik/dane
          cp "${{ inputs.wideo }}" silnik/dane/wideo.mp4
          cp "${{ inputs.dzwiek }}" silnik/dane/glos.wav
          cat > silnik/configs/inference/nasze.yaml <<'YAML'
          task_0:
            video_path: "dane/wideo.mp4"
            audio_path: "dane/glos.wav"
          YAML

      - name: Счёт
        working-directory: silnik
        run: |
          start=$(date +%s)
          python -m scripts.inference \
            --inference_config configs/inference/nasze.yaml \
            --result_dir wynik \
            --unet_model_path models/musetalkV15/unet.pth \
            --unet_config models/musetalkV15/musetalk.json \
            --version v15 \
            --ffmpeg_path /usr/bin
          echo "СЧИТАЛОСЬ $(( $(date +%s) - start )) секунд"
          find wynik -name '*.mp4' -exec ls -la {} \;

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usta
          path: silnik/wynik/**/*.mp4
          if-no-files-found: warn
