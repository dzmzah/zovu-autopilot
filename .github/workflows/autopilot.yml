name: ZOVU autopilot

# Запускается на серверах GitHub — компьютер Захара не нужен.
# Время в UTC: 07:00 = 9:00 в Польше летом, 16:00 = 18:00.
on:
  # Планировщик GitHub задерживает и иногда роняет запуски — первый слот после
  # заведения крона так и не сработал. Поэтому три попытки на слот; повторную
  # публикацию не даёт отметка слота в state.json, лишние запуски выходят молча.
  schedule:
    - cron: '0 7 * * *'
    - cron: '30 7 * * *'
    - cron: '10 8 * * *'
    - cron: '0 16 * * *'
    - cron: '30 16 * * *'
    - cron: '10 17 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'Tylko wygeneruj, bez publikacji'
        type: boolean
        default: false
      kind:
        description: 'Wymuś typ posta'
        type: choice
        default: auto
        options: [auto, single, carousel, reel]

concurrency:
  group: zovu-autopilot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Zależności
        run: npm ci || npm install

      - name: Chromium dla Playwright
        run: npx playwright install --with-deps chromium

      # рилсы собираются ffmpeg'ом; на образе runner'а его может не быть
      - name: ffmpeg
        run: ffmpeg -version >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Zrób i opublikuj post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          # ключ, которым расшифровывается самообновляющийся токен Instagrama
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          # картинки кладём в этот же репозиторий, он публичный
          CDN_REPO: ${{ github.workspace }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
          ZOVU_BG_DIR: ${{ github.workspace }}/bg
          ZOVU_READY_DIR: ${{ github.workspace }}/out
        run: node run-once.mjs ${{ inputs.dry && '--dry' || '' }} ${{ (inputs.kind && inputs.kind != 'auto') && format('--kind={0}', inputs.kind) || '' }}

      # состояние ротации (тема, формат, счётчик) храним в репозитории,
      # иначе каждый запуск начинал бы с нуля
      # страница с готовыми постами: пока API закрыт, публикуем руками с неё
      - name: Strona z gotowymi postami
        if: ${{ !inputs.dry }}
        run: node gotowe.mjs
        env:
          CDN_REPO: ${{ github.workspace }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main

      - name: Zapisz stan rotacji
        if: ${{ !inputs.dry }}
        run: |
          git config user.name "zovu-autopilot"
          git config user.email "zovu.pl@gmail.com"
          git add state.json posts token.enc index.html || true
          git diff --staged --quiet || git commit -m "post + stan rotacji [skip ci]"
          git push || true
