name: ZOVU autopilot

# Запускается на серверах GitHub — компьютер Захара не нужен.
# Время в UTC: 07:00 = 9:00 в Польше летом, 16:00 = 18:00.
on:
  # С 28.10.2026 — ОДИН графический пост в день, около 18:30 по Варшаве
  # (рилс выходит около 13:00). Окно публикации 18:15–23:30 по Варшаве
  # проверяет сам run-once.mjs, поэтому кроны стоят пачкой с запасом на оба
  # времени года (зимой Варшава = UTC+1, летом UTC+2) и на опоздания
  # планировщика GitHub (бывает 4–6 часов). Ранний запуск выходит молча за
  # секунды (шаг «Czy dziś już był post»), второй пост за сутки не выйдет:
  # слот по варшавской дате + минимум 12 часов между публикациями.
  schedule:
    - cron: '20 16 * * *'
    - cron: '35 16 * * *'
    - cron: '25 17 * * *'
    - cron: '45 17 * * *'
    - cron: '15 18 * * *'
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      udawaj:
        # Аварийные пути проверяются только так: настоящий 429 не подсунешь,
        # а оборванную сеть тем более. Непроверенный запасной путь запасным не является.
        description: 'Udawana awaria modelu: puste | 429 | 503 | siec'
        type: string
        default: ''
      dry:
        description: 'Tylko wygeneruj, bez publikacji'
        type: boolean
        default: false
      kind:
        description: 'Wymuś typ posta'
        type: choice
        default: auto
        options: [auto, single, carousel, reel]
      uklad:
        description: 'Wymuś układ pojedynczego posta'
        type: choice
        default: auto
        options: [auto, lista, foto, cytat]

concurrency:
  group: zovu-autopilot
  cancel-in-progress: false

permissions:
  contents: write
  # чтобы этот воркфлоу мог сам разбудить выкладку рилсов (шаг ниже)
  actions: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Дешёвая проверка ДО установки браузера: рилсы и сторож будят автопилот
      # много раз в день, и каждый такой прогон раньше ставил Chromium ради
      # того, чтобы через секунду выйти. Решение то же, что в run-once.mjs:
      # слот по варшавской дате и окно 18:15–23:30. Ручной запуск с dry/kind
      # проверку проходит всегда.
      - name: Czy dziś już był post
        id: bramka
        env:
          RECZNIE: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry || (inputs.kind && inputs.kind != 'auto')) }}
        run: |
          if [ "$RECZNIE" = "true" ]; then echo "idz=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          IDZ=$(node -e '
            const t = new Date().toLocaleString("sv-SE", { timeZone: "Europe/Warsaw" });
            const m = +t.slice(11, 13) * 60 + +t.slice(14, 16);
            let s = {}; try { s = require("./state.json"); } catch {}
            let kolejka = []; try { kolejka = require("./rolki/kolejka.json"); } catch {}
            const rolkaCzeka = kolejka.some((p) => !p.opublikowano && Date.parse(p.kiedy) < Date.now() - 20 * 60000);
            const postTeraz = s.posted !== t.slice(0, 10) + "-pm" && m >= 18 * 60 + 15 && m <= 23 * 60 + 30;
            console.log(postTeraz ? "1" : rolkaCzeka ? "rolka" : "0");
          ')
          echo "decyzja: $IDZ"
          echo "idz=$IDZ" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.bramka.outputs.idz == '1'
        with:
          node-version: '22'

      - name: Zależności
        if: steps.bramka.outputs.idz == '1'
        run: npm ci || npm install

      - name: Chromium dla Playwright
        if: steps.bramka.outputs.idz == '1'
        run: npx playwright install --with-deps chromium

      # рилсы собираются ffmpeg'ом; на образе runner'а его может не быть
      - name: ffmpeg
        if: steps.bramka.outputs.idz == '1'
        run: ffmpeg -version >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Zrób i opublikuj post
        if: steps.bramka.outputs.idz == '1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # запасной провайдер текста: подхватывает, когда у Gemini кончилась квота
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          ZOVU_UDAWAJ_BRAK_MODELU: ${{ inputs.udawaj }}
          # живые фото под посты; без него движок молча откатится на 3D-рендер
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          # ключ, которым расшифровывается самообновляющийся токен Instagrama
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          # картинки кладём в этот же репозиторий, он публичный
          CDN_REPO: ${{ github.workspace }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
          ZOVU_BG_DIR: ${{ github.workspace }}/bg
          ZOVU_READY_DIR: ${{ github.workspace }}/out
        run: node run-once.mjs ${{ inputs.dry && '--dry' || '' }} ${{ (inputs.kind && inputs.kind != 'auto') && format('--kind={0}', inputs.kind) || '' }} ${{ (inputs.uklad && inputs.uklad != 'auto') && format('--uklad={0}', inputs.uklad) || '' }}

      # состояние ротации (тема, формат, счётчик) храним в репозитории,
      # иначе каждый запуск начинал бы с нуля
      # страница с готовыми постами: пока API закрыт, публикуем руками с неё
      # Тестовый прогон ничего не публикует, поэтому единственный способ
      # посмотреть на пост — забрать картинку из артефактов.
      - name: Podgląd (tylko dry run)
        if: ${{ inputs.dry }}
        uses: actions/upload-artifact@v4
        with:
          name: podglad-postu
          path: out/*.jpg
          retention-days: 7
          if-no-files-found: warn

      # always(): при блокировке Meta шаг публикации валится намеренно, чтобы
      # ран был красный и пришло письмо. Страницу и стан всё равно сохраняем.
      - name: Strona z gotowymi postami
        if: ${{ always() && !inputs.dry && steps.bramka.outputs.idz == '1' }}
        run: node gotowe.mjs
        env:
          CDN_REPO: ${{ github.workspace }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main

      # Отметка слота живёт в state.json. Если её не сохранить, следующая
      # попытка того же слота (в расписании их три) решит, что сегодня ещё не
      # публиковали, и выложит ВТОРОЙ пост подряд — ровно та «необычная
      # активность», за которую Meta закрыла доступ 31.07. Поэтому push здесь
      # не «|| true», а с догоном и повторами.
      - name: Zapisz stan rotacji
        if: ${{ always() && !inputs.dry && steps.bramka.outputs.idz == '1' }}
        run: |
          git config user.name "zovu-autopilot"
          git config user.email "zovu.pl@gmail.com"
          node panel.mjs || true
          git add state.json pending.json posts token.enc index.html panel.html || true
          git diff --staged --quiet && exit 0
          git commit -m "post + stan rotacji [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            echo "push odbity (próba $i) — dociągam main"
            # checkout выкачивает один коммит: без углубления rebase не найдёт
            # общего предка и упадёт
            git fetch --deepen=50 origin main || git fetch origin main
            git rebase origin/main || exit 1
          done
          echo "::error::Nie zapisałem stanu rotacji. Slot nie jest odhaczony — kolejny przebieg może opublikować drugi post tego samego dnia."
          exit 1

      # ── ответный будильник ──────────────────────────────────────────
      # Утром 02.09 не запускался автопилот, и его будил часовой воркфлоу
      # рилсов. Днём вышло наоборот: рилсы не запускались с 11:28, а автопилот
      # отработал трижды. То есть «надёжного» воркфлоу у GitHub нет вообще,
      # роняется любой — значит будить должны друг друга оба.
      #
      # Смотрим не на расписание, а на факт: есть ли в очереди ролик, чьё
      # время вышло больше двадцати минут назад. Если есть — дергаем выкладку.
      # Повторной публикации быть не может: отметка о выкладке лежит в самой
      # очереди, и второй прогон тот же ролик пропускает.
      - name: Obudź wykładanie rolek, jeśli któraś się spóźnia
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SPOZNIONA=$(node -e '
            const fs = require("fs");
            let kolejka = [];
            try { kolejka = JSON.parse(fs.readFileSync("./rolki/kolejka.json", "utf8")); } catch {}
            const prog = Date.now() - 20 * 60000;
            const spozniona = kolejka.find(
              (p) => !p.opublikowano && Date.parse(p.kiedy) < prog
            );
            console.log(spozniona ? spozniona.plik : "");
          ')
          if [ -z "$SPOZNIONA" ]; then echo "спозднившихся рилсов нет"; exit 0; fi
          echo "::warning::Рилс $SPOZNIONA просрочен — бужу выкладку сам"
          gh workflow run rolka.yml --repo "$GITHUB_REPOSITORY"
