name: ZOVU próba rolek v2 (marka 2026 + dynamika)

# Пробная сборка выбранных сценариев в двух вариантах звука, ничего не
# публикует и в репозиторий не пишет (29.10.2026):
#   glos — голос Gemini (провайдер google) с подачей GLOS_STYL=energia;
#   bez  — без озвучки: текст на экране + музыка + звуки монтажа.
# Голос ElevenLabs здесь не тратится никогда.
on:
  workflow_dispatch:
    inputs:
      scenariusze:
        description: 'Имена сценариев через запятую'
        type: string
        default: 'kulisy-robot-robi-rolki,bol-nie-masz-czasu-na-rolki,fight-mode-promocja-gali'
      warianty:
        description: 'glos,bez'
        type: string
        default: 'glos,bez'

jobs:
  zbuduj:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Whisper
        run: python -m pip install --quiet faster-whisper
      - name: Model whispera z pamięci podręcznej
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Zależności node
        run: |
          npm ci --omit=dev || npm install --omit=dev
          npx playwright install --with-deps chromium
      - name: Zbuduj warianty
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GLOS_DOSTAWCA: google
          GCP_CLIENT_ID: ${{ secrets.GCP_CLIENT_ID }}
          GCP_CLIENT_SECRET: ${{ secrets.GCP_CLIENT_SECRET }}
          GCP_REFRESH_TOKEN: ${{ secrets.GCP_REFRESH_TOKEN }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GOOGLE_VOICE: ${{ vars.GOOGLE_VOICE }}
          GOOGLE_VOICE_ZAPAS: ${{ vars.GOOGLE_VOICE_ZAPAS }}
          GOOGLE_TTS_MODEL: ${{ vars.GOOGLE_TTS_MODEL }}
          SKORA: auto
        run: |
          mkdir -p wynik
          IFS=',' read -ra SC <<< "${{ inputs.scenariusze }}"
          IFS=',' read -ra WA <<< "${{ inputs.warianty }}"
          n=0
          for s in "${SC[@]}"; do
            n=$((n+1))
            for w in "${WA[@]}"; do
              echo "::group::$s · $w"
              rm -f out/auto-*.mp4
              if [ "$w" = "bez" ]; then FL="--bez-glosu"; export GLOS_STYL=""; else FL=""; export GLOS_STYL=energia; fi
              node rolka-auto.mjs --scenariusz="$s" $FL || echo "::warning::$s · $w nie wyszedł"
              for f in out/auto-*.mp4; do
                [ -f "$f" ] || continue
                cp "$f" "wynik/$n-$s-$w.mp4"
                cp "${f%.mp4}-meta.json" "wynik/$n-$s-$w-meta.json" || true
                cp "${f%.mp4}-plan.json" "wynik/$n-$s-$w-plan.json" || true
              done
              echo "::endgroup::"
            done
          done
          ls -la wynik
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rolki-v2
          path: wynik/
          retention-days: 7
