name: ZOVU rolka

# Выкладка ГОТОВЫХ рилсов из `rolki/kolejka.json`.
# Проверка раз в час: публикуется всё, чему время пришло. Отметка о выкладке
# коммитится обратно, поэтому второй прогон тот же рилс не повторит.
on:
  workflow_dispatch:
    inputs:
      teraz:
        description: 'Выложить первое незакрытое, не дожидаясь времени'
        type: boolean
        default: false
      dry:
        description: 'Сухой прогон — только показать, что будет'
        type: boolean
        default: false
  schedule:
    # Ежечасная проверка очереди.
    - cron: '5 * * * *'
    # Отдельные дозвоны на сами слоты публикации по Польше.
    # GitHub задерживает расписания под нагрузкой, а слот пропускать нельзя:
    # рилс, вышедший на час позже, попадает в другой поток ленты.
    #
    # Часов теперь четыре, а не два: очередь перебирает 11, 13, 18 и 20,
    # чтобы наконец накопить сравнение по времени выхода. Пока все ролики
    # выходили в 13:00, сводка «охват по часу» состояла из одной строки и
    # ничего не отвечала.
    - cron: '2,12,25 9 * * *'   # 11:00 по Польше
    - cron: '2,12,25 11 * * *'  # 13:00
    - cron: '2,12,25 16 * * *'  # 18:00
    - cron: '2,12,25 18 * * *'  # 20:00

concurrency:
  group: zovu-rolka
  cancel-in-progress: false

jobs:
  publikuj:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Zależności
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Wyłóż rolkę
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: |
          node rolka.mjs \
            ${{ inputs.teraz && '--teraz' || '' }} \
            ${{ inputs.dry && '--dry' || '' }}

      - name: Zapisz stan kolejki
        if: ${{ !inputs.dry }}
        run: |
          git config user.name  "zovu-autopilot"
          git config user.email "autopilot@zovu.pl"
          git diff --quiet -- rolki/kolejka.json && echo "очередь не менялась" && exit 0
          # Наша версия очереди уходит в сторону, дальше мы её ВЛИВАЕМ в свежий
          # main, а не пытаемся наложить как патч. Текстового конфликта здесь
          # быть не должно: наше изменение — не строки, а смысл «позиция
          # выложена тогда-то». Раньше `git pull --rebase` падал на конфликте и
          # оставлял репозиторий в неразрешённом состоянии, из которого цикл
          # уже не выбирался; отметка не попадала в main, и следующий прогон
          # выкладывал тот же рилс повторно.
          cp rolki/kolejka.json /tmp/nasza-kolejka.json
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            node scal-kolejke.mjs /tmp/nasza-kolejka.json
            git add rolki/kolejka.json
            if git diff --cached --quiet; then echo "нечего вливать"; exit 0; fi
            git commit -q -m "rolka: stan kolejki [skip ci]"
            git push -q origin HEAD:main && exit 0
            echo "не влилось с $i раза, догоняю main"
            sleep 5
          done
          echo "::error::Не записал состояние очереди — проверь ленту на повтор"
          exit 1
